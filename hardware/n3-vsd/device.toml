schema_version = 1
model_id = "n3-vsd"
profile_family = "n3"
name = "N3 (VSDinside / TreasLin)"
protocol = "vendor-crt-1"
status = "experimental"

firmware_instructions = "https://www.vsdinside.com/blogs/tutorial/vsd-stream-dock-connection-issues"
firmware_instructions_shared = true

[capabilities]
firmware_query = true
firmware_report = { kind = "feature", report_id = 1, length = 20, windows_supported = false }
sleep = true
brightness = true
lighting = false
lighting_channels = []
background = false
reliable_button_release = true
reliable_encoder_release = true
image_formats = ["png", "jpeg"]
media_formats = ["png", "jpeg", "gif", "mp4"]
max_fps = 24
frame_output = { frame_scheduling = true, grouped_key_updates = true }

[layout]
width = 624
height = 288
rotation = 0

