<section class="device-output-settings" x-data="deviceOutputSummary" x-show="supportsOutput">
    <div class="device-output-overview">
        <div>
            <h2 x-text="heading"></h2>
            <p class="field-help" x-text="outputSummary"></p>
            <p
                class="field-help"
                role="status"
                x-show="imageOutputWarning"
                x-text="imageOutputWarning"
            ></p>
        </div>
        <button
            type="button"
            class="button"
            aria-label="Adjust device output"
            aria-haspopup="dialog"
            @click="showOutput"
        >
            Device settings
            <svg
                class="workspace-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                aria-hidden="true"
            >
                <path d="M4 7h5m4 0h7M4 17h9m4 0h3M9 4v6m4 4v6" />
            </svg>
        </button>
    </div>
</section>
