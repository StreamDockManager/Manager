<div
    x-data="mediaOptions"
    class="media-options"
    :class="inBackgroundEditor && kind === 'photo' ? 'modern-photo-editor' : ''"
    x-show="asset"
>
    <div
        class="button-row photo-view-tabs"
        role="group"
        aria-label="Image preview view"
        x-show="inBackgroundEditor && kind === 'photo'"
    >
        <button
            type="button"
            class="button"
            data-view="device"
            @click="changePhotoView"
            :aria-pressed="photoView === 'device'"
        >
            Device preview
        </button>
        <button
            type="button"
            class="button"
            data-view="source"
            @click="changePhotoView"
            :aria-pressed="photoView === 'source'"
        >
            Source
        </button>
    </div>
    <div :class="layoutClass">
        <div class="video-media-summary" x-show="kind === 'clip' && !inBackgroundEditor">
            <strong x-text="clipType"></strong>
            <small x-text="clipMetadata"></small>
            <button
                type="button"
                class="button"
                @click="editVideo"
                x-text="sourceFormat === 'gif' ? 'Edit GIF' : 'Edit video'"
            ></button>
            <p class="field-help">
                Scrub, choose a section, and adjust framing and playback in the shared clip editor.
            </p>
        </div>
        <div
            class="photo-source"
            x-show="(sourceImage || sourceError) && (!inBackgroundEditor || photoView === 'source')"
        >
            <div class="photo-source-panel" x-show="sourceImage">
                <strong>Crop image</strong>
                <p class="field-help">Drag the box to move it. Drag a corner to resize.</p>
                <div class="photo-source-frame" x-ref="photoFrame" :style="sourceStyle">
                    <img
                        data-resource-role="media-preview"
                        :src="sourceImage || null"
                        alt="Original image for cropping"
                        draggable="false"
                    />
                    <div
                        class="photo-crop-box"
                        :style="cropStyle"
                        role="group"
                        tabindex="0"
                        aria-label="Image crop region"
                        @keydown="photoKey"
                        @pointerdown="startCrop"
                        @pointermove="moveCrop"
                        @pointerup="endCrop"
                        @pointercancel="cancelCrop"
                        @lostpointercapture="endCrop"
                    >
                        <button
                            type="button"
                            class="photo-crop-handle"
                            data-crop-edge="nw"
                            aria-label="Resize image crop nw"
                        ></button>
                        <button
                            type="button"
                            class="photo-crop-handle"
                            data-crop-edge="ne"
                            aria-label="Resize image crop ne"
                        ></button>
                        <button
                            type="button"
                            class="photo-crop-handle"
                            data-crop-edge="sw"
                            aria-label="Resize image crop sw"
                        ></button>
                        <button
                            type="button"
                            class="photo-crop-handle"
                            data-crop-edge="se"
                            aria-label="Resize image crop se"
                        ></button>
                    </div>
                </div>
            </div>
            <div class="photo-source-panel" x-show="sourceError">
                <p class="danger-text" role="alert" x-text="sourceError"></p>
                <button type="button" class="button" @click="previewSource">
                    Retry source image
                </button>
            </div>
        </div>
        <div
            class="media-preview-panel"
            x-show="!inBackgroundEditor || kind !== 'photo' || photoView === 'device'"
        >
            <figure class="media-device-preview" x-show="image">
                <figcaption>Device preview</figcaption>
                <div
                    class="photo-destination-frame"
                    x-ref="destinationFrame"
                    :style="inBackgroundEditor && kind === 'photo' ? destinationStyle : {}"
                >
                    <img
                        data-resource-role="media-preview"
                        class="media-edit-preview"
                        :src="image || null"
                        alt="Edited media preview"
                        draggable="false"
                    />
                    <div
                        x-show="inBackgroundEditor && kind === 'photo' && sourceImage"
                        class="video-device-pan"
                        role="group"
                        tabindex="0"
                        aria-label="Pan background preview"
                        @pointerdown="startPan"
                        @pointermove="moveCrop"
                        @pointerup="endCrop"
                        @pointercancel="cancelCrop"
                        @lostpointercapture="endCrop"
                        @keydown="photoKey"
                    ></div>
                </div>
                <div class="photo-pan-controls" x-show="inBackgroundEditor && kind === 'photo'">
                    <p class="field-help">Drag to position. Arrow keys move the image.</p>
                    <div class="button-row">
                        <button
                            type="button"
                            class="button"
                            data-zoom="0.8"
                            @click="zoomPhoto"
                            :disabled="!sourceImage || !image"
                            aria-label="Zoom out background"
                        >
                            −
                        </button>
                        <button
                            type="button"
                            class="button"
                            data-zoom="1.25"
                            @click="zoomPhoto"
                            :disabled="!sourceImage || !image"
                            aria-label="Zoom in background"
                        >
                            +
                        </button>
                        <button type="button" class="text-button" @click="resetPhoto">
                            Reset framing
                        </button>
                    </div>
                </div>
            </figure>
            <p class="field-help" x-show="!image && !desktopPreview && !error">
                Image preview is available in the desktop application.
            </p>
            <p class="field-help" role="status" x-show="!image && desktopPreview && !error">
                Loading media preview…
            </p>
            <div class="clip-details" x-show="kind === 'clip'">
                <div class="clip-source-details" x-show="inBackgroundEditor">
                    <strong x-text="clipType"></strong>
                    <span x-text="clipMetadata"></span>
                </div>
                <p class="field-help" x-text="cadenceDescription"></p>
            </div>
            <p class="danger-text" role="alert" x-show="error" x-text="error"></p>
            <button type="button" class="button" x-show="error" @click="preview">
                Retry device preview
            </button>
        </div>
        <div class="media-option-fields" x-show="kind === 'photo'">
            <label>
                Image encoding
                <select
                    aria-label="Image encoding"
                    :value="options.encoding || 'auto'"
                    data-field="encoding"
                    @change="change"
                >
                    <option value="auto">Automatic (sharp UI, efficient photos)</option>
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG (device support required)</option>
                </select>
            </label>
            <label>
                Scale
                <select
                    aria-label="Media fit"
                    :value="options.fit"
                    data-field="fit"
                    @change="change"
                >
                    <option value="fill">Fill (crop edges)</option>
                    <option value="fit">Fit (letterbox)</option>
                </select>
            </label>
            <div class="media-crop-grid">
                <label>
                    X %
                    <input
                        aria-label="Crop X"
                        type="number"
                        step="any"
                        min="0"
                        max="99"
                        :value="cropX"
                        data-field="0"
                        @input="change"
                    />
                </label>
                <label>
                    Y %
                    <input
                        aria-label="Crop Y"
                        type="number"
                        step="any"
                        min="0"
                        max="99"
                        :value="cropY"
                        data-field="1"
                        @input="change"
                    />
                </label>
                <label>
                    Width %
                    <input
                        aria-label="Crop width"
                        type="number"
                        step="any"
                        min="1"
                        max="100"
                        :value="cropWidth"
                        data-field="2"
                        @input="change"
                    />
                </label>
                <label>
                    Height %
                    <input
                        aria-label="Crop height"
                        type="number"
                        step="any"
                        min="1"
                        max="100"
                        :value="cropHeight"
                        data-field="3"
                        @input="change"
                    />
                </label>
            </div>
        </div>
    </div>
</div>
