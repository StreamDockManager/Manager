schema_version = 1
model_id = "mini"
name = "Mini"
protocol = "vendor-crt-1"
status = "experimental"

[capabilities]
firmware_query = true
boot_logo = { size = [320, 240] }
lighting_minimum_manager = "0.1.0"
sleep = true
brightness = true
lighting = true
lighting_channels = [
  "led-1",
  "led-2",
  "led-3",
  "led-4",
  "led-5",
  "led-6",
  "led-7",
  "led-8",
  "led-9",
  "led-10",
  "led-11",
  "led-12",
]
background = false
reliable_button_release = true
reliable_encoder_release = false
image_formats = ["png", "jpeg"]
media_formats = ["png", "jpeg", "gif", "mp4"]
max_fps = 24
frame_output = { frame_scheduling = true, grouped_key_updates = true }

[layout]
width = 400
height = 496
rotation = 0

