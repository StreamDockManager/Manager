schema_version = 1
model_id = "n4-pro"
name = "N4 Pro"
protocol = "crt-n4"
status = "experimental"

firmware_instructions = "https://www.vsdinside.com/blogs/tutorial/vsd-stream-dock-connection-issues"
firmware_instructions_shared = true

[capabilities]
boot_logo = { size = [800, 480] }
touch_panel = { gesture_control = "touch-strip", button_controls = [
  "touch-1",
  "touch-2",
  "touch-3",
  "touch-4",
], swipe_directions = [
  "left",
  "right",
  "up",
  "down",
] }
sleep = true
brightness = true
lighting = true
lighting_channels = ["dial-1", "dial-2", "dial-3", "dial-4"]
background = true
background_size = [800, 480]
reliable_button_release = true
reliable_encoder_release = false
image_formats = ["png", "jpeg"]
media_formats = ["png", "jpeg", "gif", "mp4"]
max_fps = 24
firmware_query = true
vibration = { toggle = true, strength = false, writable = true, unavailable_reason = "", firmware_requirements = { mirabox = "02.006" }, configuration_fields = [
  { id = "led_follow_key_light", label = "LED follows key lighting", help = "Link the LEDs to the key lighting." },
  { id = "key_light_on_disconnect", label = "Key lighting when disconnected", help = "Enable key lighting behavior when the device disconnects." },
  { id = "check_usb_power", label = "Check USB power", help = "Enable the device's USB power check." },
  { id = "reset_usb_report", label = "USB report reset", help = "Enable the device's USB reporting reset behavior." },
  { id = "enable_boot_video", label = "Boot video", help = "Enable the device's boot video." },
] }
frame_output = { frame_scheduling = true, grouped_key_updates = true }

[layout]
width = 800
height = 580
rotation = 180

