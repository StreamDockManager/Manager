schema_version = 1
model_id = "k1-pro"
name = "K1 Pro"
protocol = "vendor-crt-1"
status = "experimental"

firmware_instructions = "https://www.vsdinside.com/blogs/tutorial/vsd-stream-dock-connection-issues"
firmware_instructions_shared = true

[capabilities]
firmware_query = true
firmware_report = { kind = "input", report_id = 4, length = 513, windows_supported = true }
sleep = true
brightness = true
lighting = false
lighting_channels = []
background = false
reliable_button_release = true
reliable_encoder_release = false
image_formats = ["png", "jpeg"]
media_formats = ["png", "jpeg", "gif", "mp4"]
max_fps = 24
frame_output = { frame_scheduling = true, grouped_key_updates = true }

[capabilities.keyboard]
factory_reset = true
settings_query = true
brightness_max = 100
global_rgb = true
os_modes = ["windows", "macos"]
effect_max = 15
effect_names = [
  "Static",
  "Gradient",
  "Breathing",
  "Wave",
  "Ripple",
  "Windmill",
  "Fountain",
  "Fireworks",
  "Band",
  "Pixel",
  "Flash",
  "Halo",
  "Rush",
  "Grid",
  "Ripple",
  "Game"
]
background_color_effects = [14]
speed_max = 5
sleep_timeout_seconds_options = [60, 300, 900, 1800, 3600, 7200, 4294967295]

[layout]
width = 400
height = 416
rotation = 0

