name: native CLI packages and archives
on:
    workflow_call:
        inputs:
            tag: { required: false, type: string, default: '' }
            commit: { required: true, type: string }
            mode: { required: false, type: string, default: 'build-only' }
            targets: { required: false, type: string, default: 'all' }
            runner_service: { required: false, type: string, default: 'github' }
            macos_intel: { required: false, type: boolean, default: false }
permissions:
    contents: read
jobs:
    cli:
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !github.event.created)) && inputs.commit == github.sha && ((github.ref == 'refs/heads/package-build' && inputs.mode == 'build-only') || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.workflow_ref == format('{0}/.github/workflows/prepare-release.yml@refs/heads/main', github.repository) && ((github.repository == 'StreamDockManager/Manager' && inputs.mode == 'publish' && inputs.tag != '') || (github.repository != 'StreamDockManager/Manager' && inputs.mode == 'build-only' && inputs.tag == '')) && inputs.targets == 'all')) && (inputs.runner_service == 'github' || (inputs.runner_service == 'blacksmith' && !inputs.macos_intel && inputs.targets != 'macos-amd64'))
        uses: ./.github/workflows/build-installers.yml
        with:
            tag: ${{ inputs.tag }}
            commit: ${{ inputs.commit }}
            mode: ${{ inputs.mode }}
            product: cli
            targets: ${{ inputs.targets }}
            runner_service: ${{ inputs.runner_service }}
            macos_intel: ${{ inputs.macos_intel }}
