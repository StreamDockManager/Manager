name: Publish Release
on:
    workflow_dispatch:
        inputs:
            prepare_run_id:
                description: 'Successful Prepare Release run ID from main (publishes exactly its files)'
                required: true
                type: string
permissions:
    contents: read
    actions: read
concurrency:
    group: manager-publish-release
    cancel-in-progress: false
jobs:
    publish:
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            actions: read
        steps:
            # Trust this manually selected main workflow, never executable artifact contents
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.12'
            - name: Verify GitHub CLI
              run: command -v gh && gh --version
            - name: Verify publisher regressions
              run: python -m unittest discover -s scripts -p 'test_prepared_release.py'
            - name: Publish the verified preparation without rebuilding
              env:
                  GH_TOKEN: ${{ github.token }}
                  PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
              run: python scripts/prepared_release.py --run "$PREPARE_RUN_ID"
