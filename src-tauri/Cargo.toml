[package]
name = "stream-dock-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Opt-in standalone disposable WebKit probe; no command exposes its hooks
native-inspector-probe = []
native-resource-probe = []

[[example]]
name = "resource_diagnostics_probe"
required-features = ["native-resource-probe"]

[[example]]
name = "vendor_inspector_probe"
required-features = ["native-inspector-probe"]

[build-dependencies]
stream-dock-manager-desktop-contract.workspace = true
tauri-build = { version = "2.7.6", features = [] }

[dev-dependencies]
base64 = "0.23.1"
# Isolated vendor inspectors never use Tauri webview initialization
wry = "=0.57.3"
stream-dock-manager-runtime = { workspace = true, features = ["test-support"] }
stream-dock-manager-storage.workspace = true
tauri = { version = "2.12.7", features = ["test"] }

[dependencies]
zeroize = "1.8"
stream-dock-manager-plugin-runtimes.workspace = true
tauri = { version = "2.12.7", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-log = "2.10.2"
tauri-plugin-global-shortcut = "2.4.1"
tempfile = "3.27.0"
uuid.workspace = true
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
stream-dock-manager-runtime.workspace = true
stream-dock-manager-plugin-host.workspace = true
hardware-core.workspace = true
hardware-registry.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.23.1"
# Isolated vendor inspectors never use Tauri webview initialization
wry = "=0.57.3"
tokio = { version = "1.54.1", features = ["time", "macros", "sync"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1.1"
tauri-plugin-autostart = "2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "WKWebView",
  "WKWebViewConfiguration",
  "WKPreferences",
  "WKWebsiteDataStore",
  "WKUIDelegate",
  "WKUserContentController",
  "WKUserScript",
  "WKOpenPanelParameters",
  "WKFrameInfo",
  "WKContentWorld"
] }
block2 = "0.6.2"
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "UNUserNotificationCenter",
  "UNNotification",
  "UNNotificationSettings",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationTrigger",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSWorkspace",
  "block2",
  "NSScreen",
  "NSWindow",
  "NSAlert",
  "NSButton",
  "NSOpenPanel",
] }
objc2-core-location = { version = "0.3.2", default-features = false, features = [
  "std",
  "CLLocation",
  "CLLocationManager",
  "CLLocationManagerDelegate",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSBundle",
  "NSURL",
  "NSString",
  "NSArray",
  "NSDate",
  "NSError",
  "NSObject",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation",
  "Devices_Geolocation",
  "Win32_Storage_FileSystem",
  "Win32_System_WindowsProgramming",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri 2.12 / Wry 0.57 / WebKitGTK 2.0 use GTK 0.18 and its GLib family
# GTK 0.19 cannot be mixed into that native type graph independently
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
ashpd = { version = "0.14.1", default-features = false, features = [
  "tokio",
  "location",
  "global_shortcuts",
] }
futures-util = "0.3.34"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Test the same patched source selected for the Linux GTK runtime, rather than
# declaring an unpatched registry dependency. See ../vendor/README.md
glib = { path = "../vendor/.cache/sources/glib-0.18.5" }
