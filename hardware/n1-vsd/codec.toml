# Shared CRT mode is zero-based: b'1' + 2 emits wire ASCII '3'
mode = 2
mode_before_wake = true
# Select software mode and zero initial brightness only when opening a connection
reinitialize_on_wake = false
require_input_ok = false
wake_brightness = 0

